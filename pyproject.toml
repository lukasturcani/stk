[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "stk"
maintainers = [
  { name = "Lukas Turcani", email = "lukasturcani93@gmail.com" },
  { name = "Andrew Tarzia", email = "andrew.tarzia@gmail.com" },
]
dependencies = [
    "atomlite",
    "scipy",
    "pathos",
    "MCHammer",
    "SpinDry",
]
requires-python = ">=3.11"
dynamic = ["version"]
readme = "README.rst"

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-lazy-fixture",
    "pytest-cov",
    "sphinx",
    "sphinx-copybutton",
    "sphinx-rtd-theme",
    "chemiscope",
    "moldoc==3.0.0",
]

[project.urls]
github = "https://github.com/TarziaResearchGroup/stk-lite"
documentation = "https://stk-lite.readthedocs.io"


[tool.setuptools_scm]
write_to = "src/stk/_version.py"


[tool.ruff]
line-length = 79

[too.ruff.lint]
extend-select = ["I"]

[tool.pytest.ini_options]
testpaths = [
  "tests",
]
python_files = [
    "test_*.py",
    "*_test.py",
]
python_functions = [
  "test_*",
]

[tool.mypy]
show_error_codes = true
implicit_optional = false
warn_no_return = true
strict_optional = true

[[tool.mypy.overrides]]
module = [
  "scipy.*",
  "pytest_lazyfixture.*",
  "pathos.*",
  "mchammer.*",
  "spindry.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "rdkit.*"
ignore_missing_imports = true
follow_imports = "skip"
follow_imports_for_stubs = true
